name: Build, Sign & Release Android Packages (APK & AAB)

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Project Structure, Fix Kotlin Code & Layout XML
        run: |
          rm -f preview.html || true

          # تصحيح استيرادات Kotlin، أخطاء الـ Vibrator، وتوليد XML للعناصر تلقائياً
          python3 - << 'PYEOF'
          import os, glob, re

          app_pkg = 'com.appmaker.app'
          if os.path.exists('app/build.gradle'):
              with open('app/build.gradle', 'r', encoding='utf-8') as f:
                  bg = f.read()
              m_ns = re.search(r"namespace\s*['\"]([^'\"]+)['\"]", bg)
              if m_ns:
                  app_pkg = m_ns.group(1)
              else:
                  m_app = re.search(r"applicationId\s*['\"]([^'\"]+)['\"]", bg)
                  if m_app:
                      app_pkg = m_app.group(1)

          # 1. إنشاء item_zikr.xml تلقائياً إذا كان المشروع أذكار وتنقصه واجهة العنصر
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          item_zikr_path = 'app/src/main/res/layout/item_zikr.xml'
          if not os.path.exists(item_zikr_path):
              with open(item_zikr_path, 'w', encoding='utf-8') as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?>\n<com.google.android.material.card.MaterialCardView xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/cardZikr" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="12dp" app:cardBackgroundColor="#113826" app:cardCornerRadius="16dp" app:cardElevation="3dp" app:strokeColor="#1F5A3E" app:strokeWidth="1dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:id="@+id/tvZikrText" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="16sp"/><RelativeLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="12dp"><TextView android:id="@+id/tvZikrNote" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#A3E635" android:textSize="12sp"/><LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentEnd="true" android:orientation="horizontal"><ImageView android:id="@+id/btnResetSingle" android:layout_width="28dp" android:layout_height="28dp" android:layout_marginEnd="8dp" android:src="@android:drawable/ic_menu_rotate" app:tint="#A3E635"/><com.google.android.material.button.MaterialButton android:id="@+id/btnCounter" android:layout_width="64dp" android:layout_height="40dp" android:textSize="16sp" android:textStyle="bold" app:cornerRadius="12dp"/></LinearLayout></RelativeLayout></LinearLayout></com.google.android.material.card.MaterialCardView>''')

          # 2. فحص وتصحيح ملفات Kotlin وترتيب الاستيرادات
          for path in glob.glob('app/src/main/java/**/*.kt', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              lines = content.splitlines()
              pkg_line = f'package {app_pkg}'
              imports = {
                  'import android.content.Context',
                  'import android.view.View',
                  'import android.widget.LinearLayout',
                  'import android.view.HapticFeedbackConstants',
                  f'import {app_pkg}.R'
              }
              body_lines = []

              for line in lines:
                  s = line.strip()
                  if s.startswith('package '):
                      pkg_line = s
                  elif s.startswith('import '):
                      imports.add(s)
                  else:
                      body_lines.append(line)

              body = '\n'.join(body_lines)
              body = re.sub(r'setView\(([^)]+)\)', r'setView(\1 as android.view.View)', body)
              body = body.replace('as android.view.View as android.view.View', 'as android.view.View')
              body = body.replace('CONTEXT_IGNORE_SECURITY', 'Context.VIBRATOR_SERVICE')
              body = re.sub(r'(\.text\s*=\s*)([a-zA-Z0-9_]+)(\s*\n|\s*;)', r'\1\2.toString()\3', body)

              final_content = pkg_line + '\n\n' + '\n'.join(sorted(list(imports))) + '\n\n' + body
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(final_content)
          PYEOF

          # تصحيح الـ XML وحذف خاصية android:dir الخاطئة وتصحيح القيود
          find app/src/main/res/layout -name "*.xml" | while read xmlFile; do
            sed -i 's/android:dir="[^"]*"//g' "$xmlFile" || true
            sed -i 's/app:layout_bottomToBottomOf/layout_bottomToBottomOf/g' "$xmlFile" || true
            sed -i 's/layout_bottomToBottomOf/app:layout_constraintBottom_toBottomOf/g' "$xmlFile" || true
          done

          # إضافة مكتبة constraintlayout عند الحاجة برمجياً
          python3 - << 'PYEOF'
          import os
          if os.path.exists('app/build.gradle'):
              with open('app/build.gradle', 'r', encoding='utf-8') as f:
                  bg = f.read()
              if 'constraintlayout' not in bg and 'dependencies {' in bg:
                  bg = bg.replace('dependencies {', 'dependencies {\n    implementation \'androidx.constraintlayout:constraintlayout:2.1.4\'')
                  with open('app/build.gradle', 'w', encoding='utf-8') as f:
                      f.write(bg)
          PYEOF

          # إعداد مجلدات الأيقونات وتوفير الأيقونة المربعة والدائرية
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable; do
            mkdir -p "app/src/main/res/$d"
          done

          if [ -f "app_icon.png" ] && [ -s "app_icon.png" ]; then
            BASE_ICON="app_icon.png"
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAMAAACuSJbAAAAAA1BMVEVPToV3J+6uAAAAP0lEQVR4nO3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD4Gwe4AAFlz7k5AAAAAElFTkSuQmCC" | base64 -d > default_icon.png
            BASE_ICON="default_icon.png"
          fi

          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$BASE_ICON" "app/src/main/res/$d/ic_launcher.png" || true
            cp "$BASE_ICON" "app/src/main/res/$d/ic_launcher_round.png" || true
          done
          cp "$BASE_ICON" app/src/main/res/drawable/splash_logo.png || true

          # تنظيف أي محتوى زائد في ملفات values
          if [ -d "app/src/main/res/values" ]; then
            for xmlfile in app/src/main/res/values/*.xml; do
              if [ -f "$xmlfile" ]; then
                sed -i '/<\/resources>/q' "$xmlfile"
              fi
            done
          fi

          # إصلاح settings.gradle لقبول مستودعات المشروع المرفوعة
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF

          # تنظيف مستودعات root build.gradle إن وجدت لتفادي التعارض
          python3 - << 'PYEOF'
          import os, re
          if os.path.exists('build.gradle'):
              with open('build.gradle', 'r', encoding='utf-8') as f:
                  bg = f.read()
              bg = re.sub(r'allprojects\s*\{[^}]*repositories\s*\{[^}]*\}[^}]*\}', '', bg)
              with open('build.gradle', 'w', encoding='utf-8') as f:
                  f.write(bg)
          PYEOF

          # إنشاء مفتاح التوقيع
          keytool -genkeypair -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass appmaker123 -keypass appmaker123 -dname "CN=AppMaker, OU=Mobile, O=AppMaker, L=Algiers, S=Algiers, C=DZ"
          mkdir -p app
          cp release.keystore app/release.keystore || true

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Compile and Assemble Android Packages
        run: |
          gradle assembleRelease bundleRelease -x lint -x test --stacktrace --no-daemon

      - name: Sign Android Packages
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          find app/build/outputs/apk/release -name "*.apk" | while read APK_FILE; do
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" aligned.apk || cp "$APK_FILE" aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:appmaker123 --key-pass pass:appmaker123 --out app-release.apk aligned.apk
            break
          done

          find app/build/outputs/bundle/release -name "*.aab" | while read AAB_FILE; do
            cp "$AAB_FILE" app-release.aab
            break
          done

      - name: Publish Release Packages to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0
          name: "AppMaker v1.0.0 (Official Release)"
          files: |
            app-release.apk
            app-release.aab
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
