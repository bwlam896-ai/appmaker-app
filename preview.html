<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأذكار - محاكاة تفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .active-pulse { animation: pulse-subtle 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-6">

    <!-- Phone Frame -->
    <div class="w-full max-w-md h-[850px] bg-emerald-950 rounded-[40px] border-[8px] border-emerald-800/40 shadow-2xl flex flex-col overflow-hidden relative border-t-[12px]">
        
        <!-- Top Status Bar -->
        <div class="bg-emerald-900/80 backdrop-blur-md px-6 pt-3 pb-2 flex justify-between items-center text-xs text-emerald-200 border-b border-emerald-800/30 select-none z-10">
            <span id="clock" class="font-bold">12:00</span>
            <div class="flex items-center gap-2">
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- App Header -->
        <div class="bg-gradient-to-b from-emerald-900 to-emerald-950 p-5 shadow-lg border-b border-emerald-800/40 z-10">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                        <i data-lucide="book-open" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-amber-300">أذكار المسلم</h1>
                        <p class="text-xs text-emerald-300/80">حصن المسلم اليومي</p>
                    </div>
                </div>
                <button onclick="resetAllCurrentCategory()" class="p-2 rounded-xl bg-emerald-800/50 hover:bg-emerald-800 text-emerald-200 transition active:scale-95 border border-emerald-700/40" title="إعادة ضبط الفئة الحالية">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Categories Tabs -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pt-2 pb-1" id="category-tabs">
                <!-- Dynamic Tabs generated by JS -->
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar relative bg-slate-950/40" id="main-container">
            <!-- Dynamic Content generated by JS -->
        </div>

        <!-- Bottom Tasbeeh Counter Quick View / Floating Stats -->
        <div class="bg-emerald-900/90 backdrop-blur-md p-3 px-5 border-t border-emerald-800/50 flex justify-between items-center text-xs text-emerald-200">
            <div class="flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-amber-400"></i>
                <span>الإنجاز الإجمالي:</span>
            </div>
            <span id="total-progress-text" class="font-bold text-amber-300 text-sm">0 / 0</span>
        </div>
    </div>

    <script>
        const azkarData = {
            morning: [
                { id: 101, text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", max: 1, current: 1, note: "مرة واحدة" },
                { id: 102, text: "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", max: 1, current: 1, note: "مرة واحدة" },
                { id: 103, text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.", max: 3, current: 3, note: "3 مرات" },
                { id: 104, text: "اللَّهُمَّ عَفِني فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ.", max: 3, current: 3, note: "3 مرات" },
                { id: 105, text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.", max: 1, current: 1, note: "مرة واحدة" }
            ],
            evening: [
                { id: 201, text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", max: 1, current: 1, note: "مرة واحدة" },
                { id: 202, text: "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.", max: 1, current: 1, note: "مرة واحدة" },
                { id: 203, text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", max: 3, current: 3, note: "3 مرات" },
                { id: 204, text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ.", max: 1, current: 1, note: "مرة واحدة" }
            ],
            post_prayer: [
                { id: 301, text: "أَسْتَغْفِرُ اللَّهَ (ثَلاَثاً)، اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَّ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ.", max: 1, current: 1, note: "مرة واحدة" },
                { id: 302, text: "سُبْحَانَ اللَّهِ", max: 33, current: 33, note: "33 مرة" },
                { id: 303, text: "الْحَمْدُ لِلَّهِ", max: 33, current: 33, note: "33 مرة" },
                { id: 304, text: "اللَّهُ أَكْبَرُ", max: 33, current: 33, note: "33 مرة" },
                { id: 305, text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", max: 1, current: 1, note: "مرة واحدة لتمام المائة" }
            ],
            tasbeeh: [
                { id: 401, text: "السبحة الإلكترونية العامة", max: 100, current: 100, note: "عداد مفتوح للتسبيح" }
            ]
        };

        const categories = [
            { id: 'morning', name: 'أذكار الصباح', icon: 'sun' },
            { id: 'evening', name: 'أذكار المساء', icon: 'moon' },
            { id: 'post_prayer', name: 'بعد الصلاة', icon: 'heart-handshake' },
            { id: 'tasbeeh', name: 'السبحة', icon: 'disc' }
        ];

        let currentCat = 'morning';

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => {
                const isActive = cat.id === currentCat;
                return `
                    <button onclick="selectCategory('${cat.id}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap border ${
                        isActive 
                        ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md scale-105' 
                        : 'bg-emerald-900/60 text-emerald-200 border-emerald-700/50 hover:bg-emerald-800/60'
                    }">
                        <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function selectCategory(catId) {
            currentCat = catId;
            renderTabs();
            renderContent();
            updateTotalProgress();
        }

        function decrementCount(id) {
            const item = azkarData[currentCat].find(x => x.id === id);
            if (item && item.current > 0) {
                item.current--;
                renderContent();
                updateTotalProgress();
            }
        }

        function resetItem(id, event) {
            event.stopPropagation();
            const item = azkarData[currentCat].find(x => x.id === id);
            if (item) {
                item.current = item.max;
                renderContent();
                updateTotalProgress();
            }
        }

        function resetAllCurrentCategory() {
            azkarData[currentCat].forEach(item => item.current = item.max);
            renderContent();
            updateTotalProgress();
        }

        function updateTotalProgress() {
            let total = 0;
            let done = 0;
            Object.keys(azkarData).forEach(cat => {
                azkarData[cat].forEach(item => {
                    total += item.max;
                    done += (item.max - item.current);
                });
            });
            document.getElementById('total-progress-text').innerText = `${done} / ${total}`;
        }

        function renderContent() {
            const container = document.getElementById('main-container');
            const items = azkarData[currentCat];

            if (currentCat === 'tasbeeh') {
                const tasbeehItem = items[0];
                const countDone = tasbeehItem.max - tasbeehItem.current;
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-8 text-center space-y-6">
                        <div class="text-amber-300 font-bold text-lg">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ</div>
                        
                        <div onclick="decrementCount(${tasbeehItem.id})" class="w-56 h-56 rounded-full bg-gradient-to-br from-emerald-800 to-emerald-950 border-4 border-amber-500/50 shadow-2xl flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all group border-dashed">
                            <span class="text-xs text-emerald-300 mb-1">عدد التسبيحات</span>
                            <span class="text-5xl font-black text-amber-400 font-mono">${countDone}</span>
                            <span class="text-xs text-emerald-400 mt-2 bg-emerald-900/80 px-3 py-1 rounded-full border border-emerald-700/50">اضغط للتسبيح</span>
                        </div>

                        <div class="flex gap-4">
                            <button onclick="resetItem(${tasbeehItem.id}, event)" class="px-4 py-2 rounded-xl bg-emerald-900 border border-emerald-700/60 text-xs font-bold text-emerald-200 flex items-center gap-2 hover:bg-emerald-800 transition">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                إعادة التعيين
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = items.map(item => {
                    const isCompleted = item.current === 0;
                    const progressPercent = ((item.max - item.current) / item.max) * 100;

                    return `
                        <div onclick="decrementCount(${item.id})" class="p-4 rounded-2xl transition border cursor-pointer relative overflow-hidden select-none active:scale-[0.99] ${
                            isCompleted 
                            ? 'bg-emerald-950/40 border-emerald-800/30 opacity-60' 
                            : 'bg-emerald-900/40 border-emerald-700/40 hover:border-amber-500/40 shadow-md'
                        }">
                            <!-- Background Progress Bar -->
                            <div class="absolute right-0 top-0 bottom-0 bg-emerald-800/20 transition-all duration-300" style="width: ${progressPercent}%"></div>

                            <div class="relative z-10 flex flex-col justify-between gap-3">
                                <p class="text-base font-medium text-slate-100 leading-relaxed">${item.text}</p>
                                
                                <div class="flex justify-between items-center pt-2 border-t border-emerald-800/30">
                                    <span class="text-xs text-emerald-300/80 font-semibold">${item.note}</span>
                                    
                                    <div class="flex items-center gap-2">
                                        <button onclick="resetItem(${item.id}, event)" class="p-1.5 text-emerald-400 hover:text-amber-400 transition" title="تصفير">
                                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                        </button>

                                        <div class="px-4 py-1.5 rounded-xl font-bold text-sm min-w-[60px] text-center border shadow-inner ${
                                            isCompleted 
                                            ? 'bg-emerald-800/60 text-emerald-300 border-emerald-700/50' 
                                            : 'bg-amber-500 text-slate-950 border-amber-400'
                                        }">
                                            ${item.current}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            lucide.createIcons();
        }

        // Initialize UI
        renderTabs();
        renderContent();
        updateTotalProgress();
    </script>
</body>
</html>
